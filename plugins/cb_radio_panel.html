<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CB Radio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Barlow+Condensed:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#141310;--plate:#25231f;--plate2:#1c1a17;--edge:#3a3731;--ink:#d9d2c3;--dim:#8d8676;--lcd:#2a1c06;--amber:#ffb238;--amberdim:#5c3d0d;--red:#ff4d3a;--green:#7dff8a;--chrome:#b9b4a8;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(1200px 600px at 50% -10%,#2b2822,var(--bg));color:var(--ink);font:15px/1.4 "Barlow Condensed",system-ui,sans-serif;letter-spacing:.02em;padding:24px max(16px,env(safe-area-inset-right)) 40px max(16px,env(safe-area-inset-left))}
.wrap{max-width:980px;margin:0 auto}
.rig{background:linear-gradient(180deg,#2e2b26,var(--plate) 30%,var(--plate2));border:1px solid var(--edge);border-radius:14px;padding:18px;box-shadow:0 18px 40px #0009,inset 0 1px 0 #ffffff14}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:8px 16px;flex-wrap:wrap;margin-bottom:12px}
.brand{font-weight:700;font-size:22px;letter-spacing:.18em;color:var(--chrome)}
.brand small{font-weight:500;font-size:12px;color:var(--dim);letter-spacing:.3em;margin-left:10px}
.stat{font-size:13px;color:var(--dim);text-transform:uppercase;letter-spacing:.14em}
.stat b{color:var(--ink);font-weight:500}
.face{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}
@media (max-width:760px){.face{grid-template-columns:1fr}}
.lcd{background:linear-gradient(180deg,#331f05,var(--lcd));border:2px solid #000;border-radius:8px;padding:14px 18px;font-family:"Share Tech Mono",ui-monospace,monospace;color:var(--amber);text-shadow:0 0 8px #ffb23866;position:relative;min-width:0}
.row{display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap}
.ch{font-size:96px;line-height:.9;letter-spacing:.02em}
.ch .ghost{color:var(--amberdim);text-shadow:none}
.side{display:flex;flex-direction:column;gap:4px;padding-bottom:8px}
.freq{font-size:26px}
.tag{font-size:14px;letter-spacing:.12em}
.flags{display:flex;gap:10px;font-size:13px;letter-spacing:.14em;margin-top:6px}
.flags span{color:var(--amberdim);text-shadow:none}
.flags span.on{color:var(--amber);text-shadow:0 0 8px #ffb23899}
.flags span.tx.on{color:var(--red);text-shadow:0 0 10px #ff4d3aaa}
.meter{margin-top:12px}
.meter .lab{display:flex;justify-content:space-between;font-size:11px;color:#c98a2a;margin-bottom:3px}
.bars{display:grid;grid-template-columns:repeat(15,1fr);gap:3px;height:16px}
.bars i{background:var(--amberdim);border-radius:1px}
.bars i.on{background:var(--amber);box-shadow:0 0 6px #ffb23899}
.bars i.on.hot{background:var(--red)}
canvas{width:100%;height:70px;display:block;margin-top:12px;background:#120c03;border-radius:4px}
.controls{display:flex;flex-direction:column;gap:12px;min-width:0}
.knob{display:grid;grid-template-columns:86px 1fr 44px;align-items:center;gap:10px}
.knob label{text-transform:uppercase;letter-spacing:.16em;font-size:12px;color:var(--dim)}
.knob output{font-family:"Share Tech Mono",monospace;text-align:right;color:var(--ink)}
input[type=range]{width:100%;accent-color:var(--amber)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;font-weight:700;letter-spacing:.14em;text-transform:uppercase;background:linear-gradient(180deg,#3d3a33,#2a2823);color:var(--ink);border:1px solid #4a463e;border-radius:6px;padding:8px 12px;cursor:pointer;box-shadow:0 2px 0 #000,inset 0 1px 0 #ffffff18}
button:active{transform:translateY(1px);box-shadow:0 1px 0 #000}
button.lit{border-color:var(--amber);color:var(--amber)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.ptt{width:100%;padding:18px;font-size:22px;letter-spacing:.3em;background:linear-gradient(180deg,#4a1e18,#2d1210);border-color:#6b2a20;color:#ffb0a4;user-select:none;touch-action:none}
.ptt.on{background:linear-gradient(180deg,#a82a1c,#6d160d);color:#fff;border-color:var(--red);box-shadow:0 0 24px #ff4d3a66}
h2{font-size:13px;letter-spacing:.3em;text-transform:uppercase;color:var(--dim);font-weight:500;margin:22px 0 10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:760px){.grid{grid-template-columns:1fr}}
.card{background:var(--plate2);border:1px solid var(--edge);border-radius:10px;padding:14px;min-width:0}
.presets{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.preset{text-align:left;padding:8px 10px;display:flex;flex-direction:column;gap:2px;letter-spacing:.08em}
.preset .n{font-family:"Share Tech Mono",monospace;color:var(--amber);font-size:20px}
.preset .d{font-size:12px;color:var(--dim);font-weight:500}
.preset{position:relative}.preset .x{position:absolute;top:8px;right:8px;color:var(--dim);font-size:11px;letter-spacing:.12em}.preset .x:hover{color:var(--red)}
.add{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.add input,.add select,select{font:inherit;background:#100f0d;color:var(--ink);border:1px solid var(--edge);border-radius:6px;padding:6px 8px;min-width:0}
.add input[name=n]{flex:1 1 140px}
.list{list-style:none;margin:0;padding:0}
.list li{display:grid;grid-template-columns:1fr 64px 92px;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid #2e2b26}
.list li:last-child{border:0}
.list .km{font-family:"Share Tech Mono",monospace;color:var(--dim);text-align:right}
.mini{display:grid;grid-template-columns:repeat(9,1fr);gap:2px;height:10px}
.mini i{background:#3a2a0f}.mini i.on{background:var(--amber)}
.talk{color:var(--green)}
.empty{color:var(--dim);font-size:14px}
.keys{display:flex;gap:16px;flex-wrap:wrap;color:var(--dim);font-size:13px;margin-top:18px}
kbd{font-family:"Share Tech Mono",monospace;background:#2d2a25;border:1px solid #4a463e;border-bottom-width:2px;border-radius:4px;padding:1px 6px;color:var(--ink)}
.warn{color:#ffcf7a;font-size:14px;margin-top:10px}
</style></head><body><div class="wrap">
<div class="rig">
  <div class="top"><div class="brand">QX-40<small>40 CHANNEL AM TRANSCEIVER</small></div><div class="stat" id="stat">connecting...</div></div>
  <div class="face">
    <div class="lcd">
      <div class="row"><div class="ch" id="ch"><span class="ghost">88</span></div>
        <div class="side"><div class="freq" id="freq">--.--- MHz</div><div class="tag" id="code">PC OFF</div>
          <div class="flags"><span id="fRx">RX</span><span id="fTx" class="tx">TX</span><span id="fRb">RB</span><span id="fSq">SQ</span><span id="fPr">CHK</span></div></div></div>
      <div class="meter"><div class="lab"><span>S 1</span><span>3</span><span>5</span><span>7</span><span>9</span><span>+20</span><span>+40</span></div>
        <div class="bars" id="bars"></div><div class="lab"><span>RF / PWR</span><span id="who">&nbsp;</span></div></div>
      <canvas id="scope" width="640" height="70" aria-label="Received audio"></canvas>
    </div>
    <div class="controls">
      <div class="btns"><button id="dn" aria-label="Channel down">&#9660; CH</button><button id="up" aria-label="Channel up">CH &#9650;</button>
        <button id="c9">CH 9</button><button id="c19">CH 19</button></div>
      <div class="knob"><label for="vol">Volume</label><input type="range" id="vol" min="0" max="150"><output id="volO"></output></div>
      <div class="knob"><label for="sq">Squelch</label><input type="range" id="sq" min="0" max="95"><output id="sqO"></output></div>
      <div class="knob"><label for="mic">Mic gain</label><input type="range" id="mic" min="10" max="300"><output id="micO"></output></div>
      <div class="knob"><label for="code2">Privacy</label><select id="code2" aria-label="Privacy code"></select><output></output></div>
      <div class="btns"><button id="rb">Roger beep</button><button id="hh">Handheld on foot</button><button id="pr">Radio check</button></div>
      <div class="knob" id="prRow"><label for="prS">Check at</label><input type="range" id="prS" min="1" max="100"><output id="prSO"></output></div>
      <button class="ptt" id="ptt">PUSH TO TALK</button>
    </div>
  </div>
  <div class="keys"><span><kbd>Home</kbd> hold to talk</span><span><kbd>End</kbd> next channel</span><span><kbd>Ctrl</kbd>+<kbd>End</kbd> previous</span><span><kbd>Ctrl</kbd>+<kbd>Home</kbd> this panel</span></div>
  <div class="warn" id="warn" hidden></div>
</div>

<div class="grid">
  <div><h2>Channels</h2><div class="card">
    <div class="presets" id="presets"></div>
    <div class="add"><input name="n" id="pn" placeholder="Your channel, e.g. Night crew" maxlength="24">
      <select id="pc" aria-label="Channel"></select><select id="pk" aria-label="Privacy code"></select><button id="padd">Save</button></div>
  </div></div>
  <div><h2>On the air</h2><div class="card"><ul class="list" id="air"></ul></div>
    <h2>Rigs in range</h2><div class="card"><ul class="list" id="peers"></ul></div></div>
</div>
</div>
<script>
const FIXED=[[9,0,"Emergency","Police, EMS, breakdowns"],[19,0,"Truckers","The highway channel"],[17,0,"Coast road","East-west traffic"],
 [14,0,"Towing","Recovery and wreckers"],[21,0,"Taxi & bus","Fares and routes"],[27,0,"Delivery","Cargo and couriers"],[33,0,"Racing","Track and meets"],[3,0,"Marine","Harbour and boats"]];
let st=null,busy=false,custom=[];
const $=id=>document.getElementById(id);
const set=q=>fetch("/set?"+q).then(r=>r.json()).then(s=>{st=s;draw()}).catch(()=>{});
const sUnits=s=>s<=0?0:Math.max(1,Math.round(s*9));
for(let i=0;i<15;i++)$("bars").append(Object.assign(document.createElement("i"),{className:i>=9?"x":""}));
const opt=(sel,lo,hi,f)=>{for(let i=lo;i<=hi;i++)sel.append(new Option(f(i),i))};
opt($("code2"),0,99,i=>i?"Code "+String(i).padStart(2,"0"):"Off (open channel)");opt($("pk"),0,99,i=>i?"Code "+i:"No code");opt($("pc"),1,40,i=>"CH "+i);
function presetsFrom(s){custom=(s||"").split(";").filter(Boolean).map(p=>p.split("|")).filter(p=>p.length==3)}
function savePresets(){set("presets="+encodeURIComponent(custom.map(p=>p.join("|")).join(";")))}
function drawPresets(){const box=$("presets");box.textContent="";
 const add=(ch,code,name,desc,del)=>{const b=document.createElement("button");b.className="preset"+(st&&st.ch==ch&&st.code==code?" lit":"");
  b.innerHTML=`<span class="n">${String(ch).padStart(2,"0")}${code?` <small>PC${code}</small>`:""}</span><span>${esc(name)}</span><span class="d">${esc(desc)}</span>`;
  b.onclick=()=>set(`ch=${ch}&code=${code}`);
  if(del){const x=document.createElement("span");x.className="x";x.textContent="remove";x.onclick=e=>{e.stopPropagation();custom.splice(del-1,1);savePresets()};b.append(x)}
  box.append(b)};
 FIXED.forEach(p=>add(...p));custom.forEach((p,i)=>add(+p[1],+p[2],p[0],"Yours"+(+p[2]?", private":""),i+1));}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function li(n,km,s,talk){const l=document.createElement("li");const u=sUnits(s);
 l.innerHTML=`<span class="${talk?"talk":""}">${talk?"&#9679; ":""}${esc(n)}</span><span class="km">${km.toFixed(1)} km</span><span class="mini">${"<i></i>".repeat(9)}</span>`;
 [...l.querySelectorAll(".mini i")].forEach((e,i)=>e.classList.toggle("on",i<u));return l}
function draw(){if(!st)return;const s=st;
 $("ch").innerHTML=(s.ch<10?'<span class="ghost">8</span>':"")+s.ch;$("freq").textContent=s.freq+" MHz";
 $("code").textContent=s.code?"PRIVACY "+String(s.code).padStart(2,"0"):"OPEN CHANNEL";
 const rx=s.stations.length?Math.max(...s.stations.map(x=>x.s)):0;
 $("fRx").classList.toggle("on",rx>0&&!s.tx);$("fTx").classList.toggle("on",!!s.tx);$("fRb").classList.toggle("on",!!s.roger);$("fSq").classList.toggle("on",s.sq>0);$("fPr").classList.toggle("on",!!s.parrot);
 const lit=s.tx?Math.round(s.txLevel*15):Math.round(rx*9)+(rx>0.85?Math.round((rx-0.85)/0.15*6):0);
 [...$("bars").children].forEach((e,i)=>{e.classList.toggle("on",i<lit);e.classList.toggle("hot",i>=9)});
 $("who").textContent=s.tx?"TRANSMITTING":s.stations.length?s.stations.map(x=>x.n).join(" + "):"";
 for(const k of ["vol","sq","mic"])if(document.activeElement!==$(k)){$(k).value=s[k]}
 $("volO").value=s.vol;$("sqO").value=s.sq;$("micO").value=s.mic+"%";
 if(document.activeElement!==$("prS"))$("prS").value=s.parrotS;$("prSO").value="S"+sUnits(s.parrotS/100);$("prRow").hidden=!s.parrot;
 if(document.activeElement!==$("code2"))$("code2").value=s.code;
 $("rb").classList.toggle("lit",!!s.roger);$("hh").classList.toggle("lit",!!s.handheld);$("pr").classList.toggle("lit",!!s.parrot);$("ptt").classList.toggle("on",!!s.tx);
 $("stat").innerHTML=`<b>${esc(s.me||"-")}</b> &middot; ${s.steam?"steam ok":"no steam"} &middot; ${s.inSession} others in session &middot; range ${s.range} km`;
 const w=!s.inVeh&&!s.handheld&&!s.parrot?"You are on foot: the rig is in your vehicle. Get in, switch on Handheld, or use Radio check.":!s.steam?"Steam networking is not up: only the radio check works.":"";
 $("warn").hidden=!w;$("warn").textContent=w;
 const air=$("air");air.textContent="";s.stations.forEach(x=>air.append(li(x.n,x.km,x.s,1)));if(!s.stations.length)air.innerHTML='<li class="empty">Nobody is talking on this channel.</li>';
 const pe=$("peers");pe.textContent="";s.peers.forEach(x=>pe.append(li(x.n,x.km,x.s,0)));if(!s.peers.length)pe.innerHTML='<li class="empty">No other rig heard yet. Players need the CB Radio plugin too.</li>';
 const sig=JSON.stringify([s.ch,s.code,s.presets]);if(sig!==draw.last){draw.last=sig;presetsFrom(s.presets);drawPresets()}
 scope(s.scope)}
const cv=$("scope"),cx=cv.getContext("2d");
function scope(v){const w=cv.width,h=cv.height;cx.fillStyle="#120c03";cx.fillRect(0,0,w,h);cx.strokeStyle="#3a2808";cx.beginPath();for(let x=0;x<w;x+=40){cx.moveTo(x,0);cx.lineTo(x,h)}cx.stroke();
 cx.strokeStyle="#ffb238";cx.shadowColor="#ffb238";cx.shadowBlur=6;cx.beginPath();const n=v.length;
 for(let i=0;i<n;i++){const x=i/(n-1)*w,a=v[i]*h*0.48*(i%2?1:-1);i?cx.lineTo(x,h/2+a):cx.moveTo(x,h/2+a)}cx.stroke();cx.shadowBlur=0}
function poll(){if(busy)return;busy=true;fetch("/state").then(r=>r.json()).then(s=>{st=s;draw()}).catch(()=>{$("stat").textContent="game not running"}).finally(()=>busy=false)}
setInterval(poll,120);poll();
$("up").onclick=()=>set("ch="+(st.ch%40+1));$("dn").onclick=()=>set("ch="+((st.ch+38)%40+1));
$("c9").onclick=()=>set("ch=9&code=0");$("c19").onclick=()=>set("ch=19&code=0");
for(const k of ["vol","sq","mic","prS"])$(k).onchange=e=>set((k=="prS"?"parrotS":k)+"="+e.target.value);
$("code2").onchange=e=>set("code="+e.target.value);
$("rb").onclick=()=>set("roger="+(st.roger?0:1));$("hh").onclick=()=>set("handheld="+(st.handheld?0:1));$("pr").onclick=()=>set("parrot="+(st.parrot?0:1));
const ptt=$("ptt"),down=e=>{e.preventDefault();ptt.setPointerCapture&&ptt.setPointerCapture(e.pointerId);set("ptt=1")},up=()=>set("ptt=0");
ptt.addEventListener("pointerdown",down);ptt.addEventListener("pointerup",up);ptt.addEventListener("pointercancel",up);
$("padd").onclick=()=>{const n=$("pn").value.replace(/[|;]/g,"").trim();if(!n)return $("pn").focus();custom.push([n,$("pc").value,$("pk").value]);$("pn").value="";savePresets()};
</script></body></html>
